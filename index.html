<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEET Mock Test 2</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2933;--mu:#667085;--bd:#e3e1da;--ac:#1d6fb8;--acx:#fff;--ok:#1a7f4b;--okb:#e3f4ea;--no:#b42318;--nob:#fde8e6;--sel:#e6f0fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f2429;--tx:#e8eaed;--mu:#9aa3ad;--bd:#333a42;--ac:#5aa9ec;--acx:#0b1620;--ok:#5fd39b;--okb:#17372a;--no:#ff8a80;--nob:#3d1d1a;--sel:#1b3550;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f2429;--tx:#e8eaed;--mu:#9aa3ad;--bd:#333a42;--ac:#5aa9ec;--acx:#0b1620;--ok:#5fd39b;--okb:#17372a;--no:#ff8a80;--nob:#3d1d1a;--sel:#1b3550;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.92rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{padding:8px 0;font-size:.9rem}
.pal .done{background:var(--sel);border-color:var(--ac)}
.pal .cur{outline:2px solid var(--ac)}
.pal .ok{background:var(--okb);border-color:var(--ok)}
.pal .no{background:var(--nob);border-color:var(--no)}
.score{font-size:2.2rem;font-weight:800}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.ex{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.93rem}
.tag{font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ===== EDIT HERE: questions, marking and time =====
const TITLE = "NEET Mock Test 2";
const DURATION_MIN = 100;   // test time in minutes (1 hour 40 minutes)
const MARKS_RIGHT = 4;     // NEET: +4 for correct
const MARKS_WRONG = -1;    // NEET: -1 for wrong
const Q=(q,options,answer,explain)=>({q,options,answer,explain});
const QUESTIONS = [
Q("At its isoelectric pH, an amino acid exists mainly as a",["cation","anion","zwitterion","non-ionic neutral molecule"],2),
Q("Which of these is a non-reducing sugar?",["Maltose","Lactose","Sucrose","Glucose"],2),
Q("Malonate inhibits succinic dehydrogenase. In this type of inhibition:",["Vmax decreases, Km unchanged","Vmax unchanged, Km increases","Both Vmax and Km decrease","Vmax increases, Km decreases"],1),
Q("The pitch of an α-helix is",["3.4 Å","5.4 Å","0.54 Å","3.6 Å"],1),
Q("Which of these is NOT a nucleoside?",["Adenosine","Guanosine","Cytidine","Thymidylic acid"],3),
Q("Conversion of glucose-6-phosphate to fructose-6-phosphate is catalysed by an",["oxidoreductase","isomerase","lyase","ligase"],1),
Q("The number of reducing ends in one glycogen molecule is",["equal to the number of non-reducing ends","one","zero","two"],1),
Q("Which statement about enzymes is NOT true?",["They lower the activation energy","They alter the equilibrium of a reaction","They remain unchanged after the reaction","Most are proteins with a tertiary structure"],1),
Q("Arachidonic acid is a fatty acid with",["18 C, 3 double bonds","20 C, 4 double bonds","16 C, no double bond","20 C, 2 double bonds"],1),
Q("A double-stranded DNA of 2000 nucleotides has 20% adenine. The total number of hydrogen bonds is",["2400","2600","2800","3000"],1),
Q("Cytoplasmic transfer of ions and small molecules between adjacent animal cells occurs through",["tight junctions","adhering junctions","gap junctions","hemidesmosomes"],2),
Q("Cuboidal epithelium with a brush border is found in the",["ducts of salivary glands","PCT of the nephron","inner lining of the stomach","trachea"],1),
Q("Which of these is a specialised connective tissue?",["Areolar tissue","Adipose tissue","Blood","Ligament"],2),
Q("Each ovary of a female cockroach consists of how many ovarioles?",["4","8","16","10"],1),
Q("Which statement about the cockroach is INCORRECT?",["The heart has 13 chambers","Anal styles are present in both sexes","The gizzard has chitinous teeth","Excretion is by Malpighian tubules"],1),
Q("In a male frog, the vasa efferentia enter the kidney and open into",["Bidder’s canal","the urinary bladder","the cloaca directly","the ureter"],0),
Q("Which chamber of the frog’s heart first receives blood from the vena cavae?",["Right atrium","Sinus venosus","Left atrium","Ventricle"],1),
Q("Neuroglial cells make up about what fraction of the volume of neural tissue?",["One-tenth","One-fourth","More than one-half","Three-fourths"],2),
Q("Which of these is a compound epithelium?",["Lining of blood vessels","Lining of ducts of salivary glands","Lining of the PCT","Lining of the stomach"],1),
Q("Dense irregular connective tissue is found in",["tendons","ligaments","the dermis of the skin","cartilage"],2),
Q("Ribosomes of mitochondria and chloroplasts are",["80S","70S","60S","90S"],1),
Q("The middle lamella is mainly composed of",["calcium pectate","cellulose","lignin","hemicellulose"],0),
Q("Which of these is NOT membrane-bound?",["Ribosome","Golgi apparatus","Peroxisome","Lysosome"],0),
Q("Which set contains only organelles of the endomembrane system?",["ER, Golgi, lysosomes, vacuoles","ER, mitochondria, Golgi, lysosomes","Golgi, chloroplasts, vacuoles, ER","Lysosomes, peroxisomes, ER, mitochondria"],0),
Q("The centriole has what arrangement of microtubules?",["9+2 doublets","9+0 triplets","9+2 triplets","9+0 doublets"],1),
Q("Which statement about mitochondria is INCORRECT?",["They have two membranes","The outer membrane folds to form cristae","The matrix has circular DNA and 70S ribosomes","They divide by fission"],1),
Q("Gas vacuoles are found in",["fungi","cyanobacteria","yeast","mycoplasma"],1),
Q("The part of the bacterial flagellum embedded in the cell envelope is the",["filament","hook","basal body","sheath"],2),
Q("The plant vacuole is bounded by the tonoplast, which facilitates",["transport of ions against the concentration gradient into the vacuole","synthesis of cellulose","photophosphorylation","hydrolysis of lipids"],0),
Q("In the 9+2 axoneme of a flagellum, the two central tubules are connected by",["radial spokes","bridges","dynein arms","kinetochores"],1),
Q("A diploid cell has 16 chromosomes in G1. In G2 it has",["16 chromosomes, 16 chromatids","16 chromosomes, 32 chromatids","32 chromosomes, 32 chromatids","32 chromosomes, 64 chromatids"],1),
Q("Dissolution of the synaptonemal complex and appearance of chiasmata occur in",["zygotene","pachytene","diplotene","diakinesis"],2),
Q("In a human cell with a 24-hour cycle, interphase occupies about",["50%","75%","95%","99.9%"],2),
Q("A chromosome whose centromere is slightly away from the middle looks like what shape in anaphase?",["V","L","I","Y"],1),
Q("Free nuclear divisions in the liquid endosperm of coconut result from",["cytokinesis without karyokinesis","karyokinesis without cytokinesis","endomitosis only","amitosis"],1),
Q("Which does NOT occur in prophase of mitosis?",["Chromosome condensation","Centrosomes move to opposite poles","Reassembly of the nuclear envelope","Initiation of spindle assembly"],2),
Q("A cell has 2n = 14. At metaphase I, the number of bivalents and chromatids is",["14 and 14","7 and 28","7 and 14","14 and 28"],1),
Q("Which is NOT a feature of meiosis I?",["Synapsis","Crossing over","Division of the centromere","Reduction in chromosome number"],2),
Q("In the G0 (quiescent) stage, cells are",["metabolically inactive and dead","metabolically active but do not proliferate","replicating DNA without division","condensing chromosomes"],1),
Q("The number of pollen mother cells needed to produce 400 pollen grains is",["100","200","400","50"],0),
Q("A particle moves as x = t³ − 6t² + 9t (m). The distance covered in the first 4 s is",["4 m","8 m","12 m","16 m"],2),
Q("For a projectile, the range R = 4√3 H, where H is the maximum height. The angle of projection is",["15°","30°","45°","60°"],1),
Q("A swimmer’s speed in still water is 5 m/s, and the river flows at 3 m/s. The river is 100 m wide. He heads so that he reaches the point directly opposite. The time taken is",["20 s","25 s","30 s","33.3 s"],1),
Q("A body starts from rest with acceleration 2 m/s². The distance covered in the 5th second is",["9 m","10 m","25 m","12.5 m"],0),
Q("A body falls freely from a height h and covers 5/9 of h in the last second. The value of h is",["20 m","45 m","80 m","125 m"],1),
Q("A ball is thrown vertically up at 20 m/s. It is at a height of 15 m at two instants. The time interval between them is",["1 s","2 s","3 s","4 s"],1),
Q("If A = 3î + 4ĵ and B = î − ĵ, the component of A along B is",["1/√2","−1/√2","−1","√2"],1),
Q("A particle moves on a circle of radius 12 m. Its speed increases uniformly from rest at 3 m/s². At t = 2 s, the magnitude of its net acceleration is",["3 m/s²","3√2 m/s²","6 m/s²","6√2 m/s²"],1),
Q("Two projectiles with the same speed are thrown at 30° and 60°. The ratio of their maximum heights is",["1 : 3","1 : √3","3 : 1","1 : 2"],0),
Q("A projectile is launched at speed v and angle θ. The radius of curvature of its path at the highest point is",["v²cos²θ/g","v²sin²θ/g","v²/g","v²sin2θ/2g"],0),
Q("A ball is thrown horizontally at 15 m/s from the top of an 80 m cliff. It lands at what horizontal distance from the base?",["45 m","60 m","80 m","120 m"],1),
Q("A particle’s velocity varies with position as v = 3√x (SI units). Its acceleration is",["4.5 m/s², constant","9/(2√x) m/s²","3 m/s²","9 m/s²"],0),
Q("A particle starts from rest with a = (6 − 2t) m/s². The distance travelled before it next comes to rest is",["18 m","24 m","36 m","72 m"],2),
Q("Rain falls vertically at 6 m/s. A man walks at 8 m/s. The speed of the rain relative to the man is",["2 m/s","10 m/s","14 m/s","48 m/s"],1),
Q("Two trains, each 100 m long, move in opposite directions at 36 km/h and 54 km/h. The time to cross each other completely is",["6 s","8 s","10 s","12 s"],1),
Q("A wheel starts from rest with angular acceleration 2 rad/s². The number of revolutions in 10 s is about",["10","16","32","50"],1),
Q("The angle between vectors A and B for which |A × B| = A·B is",["30°","45°","60°","90°"],1),
Q("A car accelerates from rest at a, then decelerates at b to rest, in total time t. Its maximum speed is",["(a+b)t/ab","abt/(a+b)","(a+b)t/2","at"],1),
Q("A stone is dropped from a balloon rising at 10 m/s when the balloon is at 75 m. The stone reaches the ground after",["3 s","5 s","7.5 s","15 s"],1),
Q("A projectile’s trajectory is y = √3x − (g/2)x² (SI units). Its speed and angle of projection are",["2 m/s, 60°","2 m/s, 30°","4 m/s, 60°","√3 m/s, 45°"],0),
Q("The number of radial nodes in a 4p orbital is",["1","2","3","4"],1),
Q("The de Broglie wavelength of the electron in the 2nd Bohr orbit of hydrogen is (a₀ = 0.529 Å)",["3.32 Å","6.65 Å","13.3 Å","0.529 Å"],1),
Q("The energy of an electron in the n = 2 level of He⁺ is",["−13.6 eV","−27.2 eV","−3.4 eV","−54.4 eV"],0),
Q("An electron in n = 6 of hydrogen falls to lower levels. The number of lines in the Balmer series it can produce is",["3","4","5","10"],1),
Q("The de Broglie wavelength of an electron accelerated through 100 V is",["12.27 Å","1.227 Å","0.1227 Å","122.7 Å"],1),
Q("The uncertainty in the position of an electron is 1 Å. The minimum uncertainty in its velocity is about",["5.8 × 10⁵ m/s","5.8 × 10³ m/s","5.8 × 10⁷ m/s","5.8 × 10⁹ m/s"],0),
Q("Which set of quantum numbers (n, l, mₗ, s) is NOT permissible?",["4, 3, −3, +½","3, 2, 0, −½","2, 2, 1, +½","5, 0, 0, −½"],2),
Q("The number of electrons with mₗ = 0 in a chromium atom is",["10","12","13","14"],1),
Q("The threshold wavelength of a metal is 5000 Å. Light of 4000 Å falls on it. The maximum kinetic energy of the photoelectrons is (hc = 12400 eV·Å)",["0.31 eV","0.62 eV","1.24 eV","2.48 eV"],1),
Q("The ratio of wavelengths of the first Lyman line to the first Balmer line (λ_L : λ_B) is",["5 : 27","27 : 5","1 : 3","3 : 5"],0),
Q("The radius of the 3rd orbit of Li²⁺ is",["0.529 Å","1.587 Å","4.76 Å","0.176 Å"],1),
Q("The number of photons of wavelength 400 nm needed to supply 1 J of energy is about",["2 × 10¹⁸","2 × 10¹⁹","2 × 10¹⁶","2 × 10²⁰"],0),
Q("Which orbital has the same number of radial nodes as 3s?",["4p","3p","4d","2s"],0),
Q("The mass of one mole of electrons is about",["5.5 × 10⁻⁷ kg","5.5 × 10⁻⁴ kg","9.1 × 10⁻³¹ kg","1.67 × 10⁻²⁷ kg"],0),
Q("The maximum number of electrons in an atom that can have n + l = 5 is",["8","10","18","32"],2),
Q("The momentum of a photon of wavelength 500 nm is",["1.33 × 10⁻²⁷ kg m/s","1.33 × 10⁻²⁸ kg m/s","1.33 × 10⁻²⁶ kg m/s","1.33 × 10⁻³⁰ kg m/s"],0),
Q("The ionisation energy of Li²⁺ in its ground state is",["40.8 eV","54.4 eV","122.4 eV","13.6 eV"],2),
Q("The spin-only magnetic moment of Fe²⁺ is",["2.83 BM","3.87 BM","4.90 BM","5.92 BM"],2),
Q("The ratio of electron speeds in the 1st orbit of H and the 2nd orbit of He⁺ is",["1 : 1","1 : 2","2 : 1","1 : 4"],0),
Q("The wavelength of the series limit of the Balmer series (R = 1.097 × 10⁷ m⁻¹) is",["3646 Å","6563 Å","912 Å","1216 Å"],0)
];
// ==================================================

const app = document.getElementById("app");
let cur = 0, ans = [], left = DURATION_MIN * 60, tick = null, submitted = false;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(s){const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");}
const L = ["A","B","C","D","E","F"];

function start(){
  ans = QUESTIONS.map(()=>null); cur = 0; left = DURATION_MIN*60; submitted = false;
  clearInterval(tick);
  tick = setInterval(()=>{
    left--;
    const t = document.getElementById("t"); if(t) t.textContent = fmt(Math.max(left,0));
    if(left<=0) submit(true);
  },1000);
  renderTest();
}

function home(){
  app.innerHTML = `<div class="card"><h1>${esc(TITLE)}</h1>
  <p class="mu">${QUESTIONS.length} questions · ${DURATION_MIN} minutes · +${MARKS_RIGHT} for each correct answer, ${MARKS_WRONG} for each wrong answer, 0 if left blank.</p>
  <p>Pick one option for each question. You can move between questions and change answers until you submit. The correct answers are shown after you submit.</p>
  <button class="p" id="go">Start test</button></div>`;
  document.getElementById("go").onclick = start;
}

function renderTest(){
  const q = QUESTIONS[cur];
  const pal = QUESTIONS.map((_,i)=>`<button data-i="${i}" class="${ans[i]!==null?"done":""} ${i===cur?"cur":""}">${i+1}</button>`).join("");
  app.innerHTML = `
  <div class="top"><span class="mu">Question ${cur+1} of ${QUESTIONS.length}</span><span class="timer" id="t">${fmt(Math.max(left,0))}</span></div>
  <div class="card"><h2>${esc(q.q)}</h2>
  ${q.options.map((o,i)=>`<button class="opt ${ans[cur]===i?"sel":""}" data-o="${i}"><b>${L[i]}.</b> ${esc(o)}</button>`).join("")}
  <div class="nav"><button id="prev" ${cur===0?"disabled":""}>Previous</button><button id="clr">Clear</button><button id="next" ${cur===QUESTIONS.length-1?"disabled":""}>Next</button></div></div>
  <div class="card"><div class="pal">${pal}</div></div>
  <button class="p" id="sub" style="width:100%">Submit test</button>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.o;renderTest();});
  app.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;renderTest();});
  document.getElementById("prev").onclick=()=>{cur--;renderTest();};
  document.getElementById("next").onclick=()=>{cur++;renderTest();};
  document.getElementById("clr").onclick=()=>{ans[cur]=null;renderTest();};
  document.getElementById("sub").onclick=()=>{
    const un = ans.filter(a=>a===null).length;
    const box=document.createElement("div"); box.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50"; box.innerHTML=`<div class="card" style="max-width:380px;margin:0"><h2>Submit test?</h2><p class="mu">${un?`You have ${un} unanswered question(s).`:"You have answered all questions."} You can’t change answers after submitting.</p><div class="nav"><button id="cn">Go back</button><button class="p" id="cy">Yes, submit</button></div></div>`; document.body.appendChild(box); document.getElementById("cn").onclick=()=>box.remove(); document.getElementById("cy").onclick=()=>{box.remove(); submit(false);};
  };
}

function submit(auto){
  if(submitted) return; submitted = true; clearInterval(tick);
  let right=0,wrong=0,blank=0;
  QUESTIONS.forEach((q,i)=>{ if(ans[i]===null) blank++; else if(ans[i]===q.answer) right++; else wrong++; });
  const score = right*MARKS_RIGHT + wrong*MARKS_WRONG, max = QUESTIONS.length*MARKS_RIGHT, pct = Math.max(0, Math.round(score/max*1000)/10);
  const review = QUESTIONS.map((q,i)=>{
    const st = ans[i]===null ? "Not answered" : ans[i]===q.answer ? "Correct" : "Wrong";
    return `<div class="card"><div class="mu">Question ${i+1} · <span class="tag" style="color:${st==="Correct"?"var(--ok)":st==="Wrong"?"var(--no)":"var(--mu)"}">${st}</span></div>
    <h2>${esc(q.q)}</h2>
    ${q.options.map((o,j)=>`<div class="opt ${j===q.answer?"ok":(j===ans[i]?"no":"")}"><b>${L[j]}.</b> ${esc(o)}${j===q.answer?" ✔":""}${j===ans[i]&&j!==q.answer?" (your answer)":""}</div>`).join("")}
    ${ans[i]!==q.answer?`<div class="ex"><b>Correct answer:</b> ${L[q.answer]}. ${esc(q.options[q.answer])}</div>`:""}${q.explain?`<div class="ex"><b>Explanation:</b> ${esc(q.explain)}</div>`:""}</div>`;
  }).join("");
  app.innerHTML = `<div class="card"><h1>Test submitted${auto?" (time up)":""}</h1>
  <div class="score">${pct}%</div><div class="mu">Marks: ${score} out of ${max}</div>
  <div class="stats"><span>✔ Correct: <b>${right}</b></span><span>✘ Wrong: <b>${wrong}</b></span><span>– Skipped: <b>${blank}</b></span></div>
  <p class="mu">Scroll down to see the correct answers.</p><button class="p" id="again">Retake test</button></div>${review}`;
  document.getElementById("again").onclick = start;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
